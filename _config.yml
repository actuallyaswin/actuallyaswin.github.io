title: Aswin Sivaraman
description: >-
  Aswin Sivaraman — ML Engineer at Apple working on Siri. PhD from Indiana
  University. Research in speech and music processing.
url: "https://actuallyaswin.github.io"

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - kramdown-math-katex

feed:
  path: blog/feed.xml

kramdown:
  math_engine: katex
  math_engine_opts: {}

# GitHub Pages Configuration
# This file tells Jekyll which files/folders to exclude from the built site

# Exclude these paths from being built/served on GitHub Pages
# music_editor/ is a private local-only tool and should not be publicly accessible
# music/*.py, *.md, *.csv, *.json, *.ipynb, *.sh are the Python CLI toolchain,
# working notes, and scratch data behind music/ — not part of the public SPA
exclude:
  - music_editor/
  - README.md
  - blog/README.md
  - .gitignore
  - music/*.py
  - music/*.md
  - music/*.csv
  - music/*.json
  - music/*.ipynb
  - music/*.sh
  - music/*.txt
  - music/tmp.html
  - music/genius_api.html
  - music/listening_history.sqlite
  - music/listening_history_overrides.sqlite
  - music/master.sqlite
  - music/master.sqlite.gz
  - music/master.sqlite-wal
  - music/master.sqlite-shm
