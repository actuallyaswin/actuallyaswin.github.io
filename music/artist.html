<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music | Aswin Sivaraman</title>
    <link rel="stylesheet" href="{{ '/css/global.css' | relative_url }}">
    <link rel="stylesheet" href="styles.css">
    <script src="{{ '/js/lucide.js' | relative_url }}"></script>
</head>
<body>
    {% include masthead.html show_search=true %}
    <script src="{{ '/js/get-css-color.js' | relative_url }}"></script>
    <script src="{{ '/js/theme.js' | relative_url }}"></script>

    <!-- Search modal -->
    <div id="searchOverlay" class="search-overlay" hidden aria-modal="true" role="dialog" aria-label="Search">
        <div class="search-backdrop"></div>
        <div class="search-modal">
            <div class="search-input-row">
                <i data-lucide="search" class="search-modal-icon"></i>
                <input id="searchInput" class="search-modal-input" type="text"
                       placeholder="Search releases, artists, tracks…" autocomplete="off" spellcheck="false">
                <kbd class="search-esc-hint">Esc</kbd>
            </div>
            <div id="searchResults" class="search-modal-results"></div>
        </div>
    </div>

    <div class="container">
        <div class="site-header">
            <a href="javascript:history.back()" class="back-button">← Back</a>
        </div>

        <header id="artistHeader" class="artist-header-layout">
            <div class="artist-photo-container">
                <div class="artist-photo" id="artistPhoto">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="50" fill="#1e293b"/>
                        <text x="50" y="60" text-anchor="middle" font-size="40" fill="#475569">♪</text>
                    </svg>
                </div>
            </div>
            <div class="artist-info-container">
                <h1 id="artistName">Loading...</h1>
                <div class="stats-compact" id="artistStats">
                    <div class="stat-item">
                        <span class="stat-value" id="totalPlays">-</span>
                        <span class="stat-label">plays</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="uniqueTracks">-</span>
                        <span class="stat-label">tracks</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalReleases">-</span>
                        <span class="stat-label">releases</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Listening History Chart -->
        <section class="chart-container">
            <div class="chart-header">
                <h3 class="chart-title">Listening History Over Time</h3>
                <div class="chart-controls">
                    <div class="control-group">
                        <button class="control-btn active" data-granularity="monthly">Monthly</button>
                        <button class="control-btn" data-granularity="yearly">Yearly</button>
                    </div>
                    <div class="control-group">
                        <button class="control-btn active" data-type="distribution">Distribution</button>
                        <button class="control-btn" data-type="cumulative">Cumulative</button>
                    </div>
                </div>
            </div>
            <canvas id="historyChart"></canvas>
        </section>

        <!-- Two Column Layout for Releases and Tracks -->
        <div class="two-column-layout">
            <!-- Releases -->
            <section class="column">
                <div class="section-header">
                    <h2>Top Releases</h2>
                    <div class="sort-controls">
                        <button class="sort-btn active" data-sort-releases="listens" title="Sort by listens"><i data-lucide="headphones"></i></button>
                        <button class="sort-btn" data-sort-releases="minutes" title="Sort by minutes"><i data-lucide="clock"></i></button>
                        <button class="sort-btn" data-sort-releases="date" title="Sort by release date"><i data-lucide="calendar"></i></button>
                    </div>
                </div>
                <div id="releases">
                    <div class="loading">Loading releases...</div>
                </div>
            </section>

            <!-- Top Tracks -->
            <section class="column">
                <div class="section-header">
                    <h2>Top Tracks</h2>
                    <div class="sort-controls">
                        <button class="sort-btn active" data-sort-tracks="listens" title="Sort by listens"><i data-lucide="headphones"></i></button>
                        <button class="sort-btn" data-sort-tracks="minutes" title="Sort by minutes"><i data-lucide="clock"></i></button>
                    </div>
                </div>
                <div class="track-two-col" id="topTracks">
                    <div class="loading">Loading tracks...</div>
                </div>
            </section>
        </div>

        <footer>
            <p>Powered by <a href="https://github.com/sql-js/sql.js" target="_blank">sql.js</a></p>
        </footer>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="artist.js"></script>
    <script src="search.js"></script>
</body>
</html>
