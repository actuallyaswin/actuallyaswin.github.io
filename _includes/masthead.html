<header class="masthead">
  <a class="masthead-title" href="{{ '/' | relative_url }}">Aswin Sivaraman</a>
  <nav class="masthead-nav">
    {%- comment -%} Match the first path segment: /blog/tag/music/ contains both "blog" and "music". {%- endcomment -%}
    {%- assign section = page.url | split: '/' | slice: 1 | first -%}
    <a href="{{ '/' | relative_url }}"{% if section == nil %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/blog/' | relative_url }}"{% if section == 'blog' %} aria-current="page"{% endif %}>Blog</a>
    <a href="{{ '/music/' | relative_url }}"{% if section == 'music' %} aria-current="page"{% endif %}>Music</a>
    {% include theme-toggle.html %}
  </nav>
</header>
